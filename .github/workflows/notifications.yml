name: Notification CI
on:
  workflow_run:
    workflows: ["Uptime CI"]
    types:
      - completed
jobs:
  notify:
    name: Send notifications
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          
      - name: Check for status changes
        id: check
        run: |
          # Buscar commits de estado en los últimos 5 commits (no solo HEAD~1)
          COMMIT_MSG=$(git log -5 --pretty=%B | grep -E "🟩.*is up|🟥.*is down" | head -1)
          
          # Si encontró un commit de estado, verificar si es reciente (últimos 2 minutos)
          if [ -n "$COMMIT_MSG" ]; then
            # Obtener el hash del commit que contiene ese mensaje
            COMMIT_HASH=$(git log -5 --pretty=%H --grep="$(echo "$COMMIT_MSG" | sed 's/[][()\.^$*+?{}|]/\\&/g')" | head -1)
            
            # Obtener timestamp del commit
            COMMIT_TIME=$(git show -s --format=%ct "$COMMIT_HASH")
            CURRENT_TIME=$(date +%s)
            TIME_DIFF=$((CURRENT_TIME - COMMIT_TIME))
            
            # Si el commit es de hace menos de 3 minutos (180 segundos)
            if [ $TIME_DIFF -lt 180 ]; then
              echo "Commit de estado encontrado hace $TIME_DIFF segundos"
              echo "has_changes=true" >> $GITHUB_OUTPUT
              
              # Extraer nombre del sitio
              SITE_NAME=$(echo "$COMMIT_MSG" | sed -n 's/.*[🟩🟥] \(.*\) is.*/\1/p' | xargs || echo "Sitio")
              
              if echo "$COMMIT_MSG" | grep -qi "is up"; then
                STATUS="🟢 RECUPERADO"
                EMOJI="✅"
                MESSAGE="$SITE_NAME se ha recuperado y está funcionando correctamente"
              elif echo "$COMMIT_MSG" | grep -qi "is down"; then
                STATUS="🔴 CAÍDO"
                EMOJI="⚠️"
                MESSAGE="$SITE_NAME está experimentando problemas y no responde"
              fi
              
              echo "status=$STATUS" >> $GITHUB_OUTPUT
              echo "emoji=$EMOJI" >> $GITHUB_OUTPUT
              echo "site=$SITE_NAME" >> $GITHUB_OUTPUT
              echo "custom_message=$MESSAGE" >> $GITHUB_OUTPUT
              echo "commit_msg<<EOF" >> $GITHUB_OUTPUT
              echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "Commit de estado encontrado pero es antiguo (hace $TIME_DIFF segundos)"
            fi
          fi
          
          # Si NO encontró commit reciente, verificar sitios DOWN actuales
          echo "No hay cambios recientes, verificando sitios caídos..."
          DOWN_SITES=""
          
          for file in history/*.yml; do
            if [ -f "$file" ]; then
              STATUS=$(grep "^  status:" "$file" | head -1 | awk '{print $2}')
              if [ "$STATUS" = "down" ]; then
                SITE_NAME=$(basename "$file" .yml | sed 's/-/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) tolower(substr($i,2));}1')
                if [ -z "$DOWN_SITES" ]; then
                  DOWN_SITES="$SITE_NAME"
                else
                  DOWN_SITES="$DOWN_SITES, $SITE_NAME"
                fi
              fi
            fi
          done
          
          if [ -n "$DOWN_SITES" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "status=🔴 SIGUE CAÍDO" >> $GITHUB_OUTPUT
            echo "emoji=⚠️" >> $GITHUB_OUTPUT
            echo "site=$DOWN_SITES" >> $GITHUB_OUTPUT
            echo "custom_message=Los siguientes sitios continúan sin responder" >> $GITHUB_OUTPUT
            echo "commit_msg=Verificación periódica de sitios caídos" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Todos los sitios están UP y estables"
          fi
          
      - name: Send Telegram notification
        if: steps.check.outputs.has_changes == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ${{ steps.check.outputs.emoji }} *ALERTA DE MONITOREO*
            
            *Sitio:* ${{ steps.check.outputs.site }}
            *Estado:* ${{ steps.check.outputs.status }}
            
            ${{ steps.check.outputs.custom_message }}
            
            📋 _${{ steps.check.outputs.commit_msg }}_
            
            🔗 [Ver detalles](https://github.com/${{ github.repository }}/actions)
            
            _Arissta Uptime Monitor_
