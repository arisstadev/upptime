name: Notification CI

on:
  workflow_run:
    workflows: ["Uptime CI"]
    types:
      - completed

jobs:
  notify:
    name: Send notifications
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          
      - name: Check for status changes
        id: check
        run: |
          # Obtener archivos de history/ que cambiaron
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep "^history/.*\.yml$" || echo "")
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No hay cambios en archivos de historia"
            exit 0
          fi
          
          echo "has_changes=true" >> $GITHUB_OUTPUT
          
          # Procesar cada archivo cambiado
          NOTIFICATIONS=""
          
          for file in $CHANGED_FILES; do
            # Extraer nombre del sitio del archivo (ej: history/arissta.yml -> Arissta)
            SITE_NAME=$(basename "$file" .yml | sed 's/-/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) tolower(substr($i,2));}1')
            
            # Obtener el status actual del archivo
            CURRENT_STATUS=$(git show HEAD:"$file" | grep "^  status:" | head -1 | awk '{print $2}')
            
            # Obtener el status anterior
            PREVIOUS_STATUS=$(git show HEAD~1:"$file" 2>/dev/null | grep "^  status:" | head -1 | awk '{print $2}' || echo "unknown")
            
            echo "Sitio: $SITE_NAME"
            echo "Estado anterior: $PREVIOUS_STATUS"
            echo "Estado actual: $CURRENT_STATUS"
            
            # Solo notificar si hay cambio de estado real
            if [ "$CURRENT_STATUS" != "$PREVIOUS_STATUS" ] && [ "$PREVIOUS_STATUS" != "unknown" ]; then
              if [ "$CURRENT_STATUS" = "up" ]; then
                STATUS="🟢 RECUPERADO"
                EMOJI="✅"
                MESSAGE="$SITE_NAME se ha recuperado y está funcionando correctamente"
              elif [ "$CURRENT_STATUS" = "down" ]; then
                STATUS="🔴 CAÍDO"
                EMOJI="⚠️"
                MESSAGE="$SITE_NAME está experimentando problemas y no responde"
              else
                STATUS="📊 CAMBIO"
                EMOJI="🔔"
                MESSAGE="$SITE_NAME ha cambiado de estado: $PREVIOUS_STATUS → $CURRENT_STATUS"
              fi
              
              # Agregar a la lista de notificaciones
              if [ -z "$NOTIFICATIONS" ]; then
                NOTIFICATIONS="$EMOJI|$STATUS|$SITE_NAME|$MESSAGE"
              else
                NOTIFICATIONS="$NOTIFICATIONS
$EMOJI|$STATUS|$SITE_NAME|$MESSAGE"
              fi
            fi
          done
          
          if [ -z "$NOTIFICATIONS" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No hay cambios de estado reales para notificar"
          else
            echo "notifications<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTIFICATIONS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
          
      - name: Send Telegram notifications
        if: steps.check.outputs.has_changes == 'true'
        run: |
          NOTIFICATIONS="${{ steps.check.outputs.notifications }}"
          
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              EMOJI=$(echo "$line" | cut -d'|' -f1)
              STATUS=$(echo "$line" | cut -d'|' -f2)
              SITE=$(echo "$line" | cut -d'|' -f3)
              MESSAGE=$(echo "$line" | cut -d'|' -f4)
              
              # Formatear mensaje para Telegram
              TELEGRAM_MESSAGE="$EMOJI *ALERTA DE MONITOREO*

*Sitio:* $SITE
*Estado:* $STATUS

$MESSAGE

🔗 [Ver detalles](https://github.com/${{ github.repository }}/actions)

_Arissta Uptime Monitor_"
              
              # Enviar notificación
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                -d parse_mode="Markdown" \
                -d text="$TELEGRAM_MESSAGE"
              
              # Pequeña pausa entre mensajes
              sleep 1
            fi
          done <<< "$NOTIFICATIONS"
